<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/profile.css">
        <title>ARIUM — Profile</title>
    </head>
    <body>
        <main class="app">

            <section class="profile-card">
                <img class="corner leftCorner"  src="./img/corner.svg" alt="">
                <img class="corner righCorner"  src="./img/corner.svg" alt="">

                <img src="./img/armor.svg" alt="armor icon" class="avatar">

                <div class="top-bar" id="nameSection">
                    <h3 id="nameTag">Hunter</h3>
                    <button id="editNameBtn" class="edit-btn">✎</button>
                </div>

                <div class="rank-badge">
                    <span id="rankLetter" class="rank-letter">E</span>
                    <span id="rankTitle"  class="rank-title">Novice</span>
                </div>

                <div class="level-row">
                    <span class="label">Level</span>
                    <span id="profileLevel" class="goldy">1</span>
                </div>

                <div id="profileLevelBar">
                    <div id="profileLevelProgress" style="width:0%">0%</div>
                </div>

                <img class="corner leftBottomCorner"  src="./img/corner.svg" alt="">
                <img class="corner rigthBottonCorner" src="./img/corner.svg" alt="">
            </section>

            <section class="stats-card">
                <h4 class="card-title">Attributes</h4>
                <div class="attr-row">
                    <span class="attr-label">Strength</span>
                    <div class="attr-bar"><div id="bar-strength" class="attr-fill strength-fill" style="width:0%"></div></div>
                    <span id="val-strength" class="attr-val">0</span>
                </div>
                <div class="attr-row">
                    <span class="attr-label">Core</span>
                    <div class="attr-bar"><div id="bar-core" class="attr-fill core-fill" style="width:0%"></div></div>
                    <span id="val-core" class="attr-val">0</span>
                </div>
                <div class="attr-row">
                    <span class="attr-label">Power</span>
                    <div class="attr-bar"><div id="bar-power" class="attr-fill power-fill" style="width:0%"></div></div>
                    <span id="val-power" class="attr-val">0</span>
                </div>
                <div class="attr-row">
                    <span class="attr-label">Endurance</span>
                    <div class="attr-bar"><div id="bar-endurance" class="attr-fill endurance-fill" style="width:0%"></div></div>
                    <span id="val-endurance" class="attr-val">0</span>
                </div>
            </section>

            <section class="stats-card">
                <div class="stat">
                    <span class="stat-label">Streak</span>
                    <span id="streakCount" class="stat-value goldy">0 days</span>
                </div>
                <div class="divider"></div>
                <div class="stat">
                    <span class="stat-label">Total XP</span>
                    <span id="totalXPDisplay" class="stat-value">0 xp</span>
                </div>
                <div class="divider"></div>
                <div class="stat">
                    <span class="stat-label">Completed</span>
                    <span id="totalCompleted" class="stat-value">0</span>
                </div>
            </section>

        </main>

        <footer>
            <nav>
                <a href="trial.html"><img src="./img/axe.svg"    alt="trial page"   loading="lazy"></a>
                <a href="index.html"><img src="./img/main.svg"   alt="home page"    loading="lazy"></a>
                <a href="profile.html"><img src="./img/armor.svg" alt="profile page" loading="lazy"></a>
            </nav>
        </footer>

        <script src="js/shared.js"></script>
        <script src="js/profil.js"></script>
    </body>
</html>
