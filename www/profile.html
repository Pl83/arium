<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'none'; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="dark light">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/profile.css">
        <!-- Applies the stored theme before first paint; must stay in <head> -->
        <script src="js/theme.js"></script>
        <title>ARIUM — Profile</title>
    </head>
    <body>
        <main class="app">

            <!-- ── Identity card ── -->
            <section class="profile-card">

                <!-- Cloth sigil — laurel wreath around a burning star -->
                <div class="avatar-wrap">
                    <svg width="78" height="78" viewBox="0 0 60 60" fill="none" aria-hidden="true">
                        <circle class="svg-well" cx="30" cy="30" r="25" fill="rgba(0,0,0,0.33)" stroke="currentColor" stroke-width="1.6"/>
                        <circle cx="30" cy="30" r="20" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
                        <path d="M10 38c4 6 9 9 9 9M9 33c5 5 11 7 11 7" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.7"/>
                        <path d="M50 38c-4 6-9 9-9 9M51 33c-5 5-11 7-11 7" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.7"/>
                        <path d="M30 17l4.1 10.1L45 29l-8.2 6.2 3 10.7L30 41.5l-9.8 4.4 3-10.7L15 29l10.9-1.9L30 17z" fill="currentColor" opacity="0.85"/>
                    </svg>
                </div>

                <!-- Editable name strip -->
                <div class="top-bar" id="nameSection">
                    <h3 id="nameTag">Saint</h3>
                    <button id="editNameBtn" class="edit-btn">✎</button>
                </div>

                <!-- Rank badge — JS sets #rankLetter textContent + className -->
                <div class="rank-badge">
                    <span id="rankLetter" class="rank-letter rank-e">E</span>
                    <div class="rank-info">
                        <span class="rank-kicker">Rank</span>
                        <span id="rankTitle" class="rank-title">Aspirant</span>
                    </div>
                </div>

                <!-- Level -->
                <div class="level-row">
                    <span class="label">Level</span>
                    <span id="profileLevel" class="goldy">1</span>
                </div>

                <!-- Cosmo bar -->
                <div id="profileLevelBar">
                    <div id="profileLevelProgress" style="width:0%"></div>
                    <span id="profileLevelLabel">0%</span>
                </div>

            </section>

            <!-- ── Attributes (Radar chart + hidden bars for JS) ── -->
            <section class="stats-card">
                <div class="section-head">
                    <div class="accent-bar"></div>
                    <div>
                        <span class="head-kicker">Analysis</span>
                        <span class="head-title">Attributes</span>
                    </div>
                </div>

                <!-- Radar chart drawn by profil.js -->
                <div class="radar-wrap">
                    <svg id="radar-chart" width="220" height="220" viewBox="0 0 220 220" style="overflow:visible;" aria-label="Attribute radar chart"></svg>
                </div>

                <!-- Hidden bars kept for JS compatibility -->
                <div class="attr-bars-hidden">
                    <div class="attr-row">
                        <span class="attr-label">Strength</span>
                        <div class="attr-bar"><div id="bar-strength" class="attr-fill strength-fill" style="width:0%"></div></div>
                        <span id="val-strength" class="attr-val">0</span>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">Core</span>
                        <div class="attr-bar"><div id="bar-core" class="attr-fill core-fill" style="width:0%"></div></div>
                        <span id="val-core" class="attr-val">0</span>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">Power</span>
                        <div class="attr-bar"><div id="bar-power" class="attr-fill power-fill" style="width:0%"></div></div>
                        <span id="val-power" class="attr-val">0</span>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">Endurance</span>
                        <div class="attr-bar"><div id="bar-endurance" class="attr-fill endurance-fill" style="width:0%"></div></div>
                        <span id="val-endurance" class="attr-val">0</span>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">Agility</span>
                        <div class="attr-bar"><div id="bar-agility" class="attr-fill agility-fill" style="width:0%"></div></div>
                        <span id="val-agility" class="attr-val">0</span>
                    </div>
                </div>
            </section>

            <!-- ── General stats ── -->
            <section class="stats-card">
                <div class="stat">
                    <span class="stat-label">Streak</span>
                    <span id="streakCount" class="stat-value goldy">0 days</span>
                </div>
                <div class="divider"></div>
                <div class="stat">
                    <span class="stat-label">Total Cosmo</span>
                    <span id="totalXPDisplay" class="stat-value">0 cosmo</span>
                </div>
                <div class="divider"></div>
                <div class="stat">
                    <span class="stat-label">Completed</span>
                    <span id="totalCompleted" class="stat-value">0</span>
                </div>
            </section>

            <!-- ── Display settings ── -->
            <section class="stats-card">
                <div class="section-head">
                    <div class="accent-bar"></div>
                    <div>
                        <span class="head-kicker">Display</span>
                        <span class="head-title">Theme</span>
                    </div>
                </div>

                <!-- profil.js sets .active from the stored choice -->
                <div class="segmented" id="themeControl" role="group" aria-label="Theme">
                    <button type="button" class="seg-btn" data-theme-choice="auto">Auto</button>
                    <button type="button" class="seg-btn" data-theme-choice="dark">Dark</button>
                    <button type="button" class="seg-btn" data-theme-choice="light">Light</button>
                </div>
                <p class="seg-hint">Auto follows your device setting.</p>
            </section>

        </main>

        <!-- ── Footer nav ── -->
        <footer>
            <nav>
                <a href="index.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>
                <a href="trial.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M15 5l4-4 2 2-4 4"/>
                    </svg>
                    <span class="nav-label">Ordeals</span>
                </a>
                <a href="rankings.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 18h18M3 18l1-9 5 4 3-7 3 7 5-4 1 9"/>
                    </svg>
                    <span class="nav-label">Ranks</span>
                </a>
                <a href="profile.html" class="nav-active">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z M9 12l2 2 4-4"/>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>
        </footer>

        <script src="js/shared.js"></script>
        <script src="js/profil.js"></script>
    </body>
</html>
