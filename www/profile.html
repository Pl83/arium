<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src *; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="dark">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/profile.css">
        <title>ARIUM — Profile</title>
    </head>
    <body>
        <main class="app">

            <!-- ── Identity card ── -->
            <section class="profile-card">

                <!-- Diamond glyph avatar (replaces armor.svg) -->
                <div class="avatar-wrap">
                    <svg width="68" height="78" viewBox="0 0 40 46" fill="none" aria-hidden="true">
                        <path d="M20 2L38 16L30 44H10L2 16L20 2z" stroke="#9B8CFF" stroke-width="1.5" fill="rgba(155,140,255,0.12)"/>
                        <path d="M20 2L38 16L30 44H10L2 16L20 2z" stroke="#9B8CFF" stroke-width="3" opacity="0.3"/>
                        <path d="M20 2L20 44M2 16L38 16M10 44L20 16L30 44" stroke="#9B8CFF" stroke-width="0.8" opacity="0.6" fill="none"/>
                        <path d="M16 8L24 8L20 16L16 8z" fill="#9B8CFF" opacity="0.4"/>
                    </svg>
                </div>

                <!-- Editable name strip -->
                <div class="top-bar" id="nameSection">
                    <h3 id="nameTag">Hunter</h3>
                    <button id="editNameBtn" class="edit-btn">✎</button>
                </div>

                <!-- Rank badge — JS sets #rankLetter textContent + className -->
                <div class="rank-badge">
                    <span id="rankLetter" class="rank-letter rank-e">E</span>
                    <div class="rank-info">
                        <span class="rank-kicker">Rank</span>
                        <span id="rankTitle" class="rank-title">Novice</span>
                    </div>
                </div>

                <!-- Level -->
                <div class="level-row">
                    <span class="label">Level</span>
                    <span id="profileLevel" class="goldy">1</span>
                </div>

                <!-- Level bar -->
                <div id="profileLevelBar">
                    <div id="profileLevelProgress" style="width:0%">0%</div>
                </div>

            </section>

            <!-- ── Attributes (Radar chart + hidden bars for JS) ── -->
            <section class="stats-card">
                <div class="section-head">
                    <div class="accent-bar"></div>
                    <div>
                        <span class="head-kicker">Analysis</span>
                        <span class="head-title">Attributes</span>
                    </div>
                </div>

                <!-- Radar chart drawn by profil.js -->
                <div class="radar-wrap">
                    <svg id="radar-chart" width="220" height="220" viewBox="0 0 220 220" style="overflow:visible;" aria-label="Attribute radar chart"></svg>
                </div>

                <!-- Hidden bars kept for JS compatibility -->
                <div class="attr-bars-hidden">
                    <div class="attr-row">
                        <span class="attr-label">Strength</span>
                        <div class="attr-bar"><div id="bar-strength" class="attr-fill strength-fill" style="width:0%"></div></div>
                        <span id="val-strength" class="attr-val">0</span>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">Core</span>
                        <div class="attr-bar"><div id="bar-core" class="attr-fill core-fill" style="width:0%"></div></div>
                        <span id="val-core" class="attr-val">0</span>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">Power</span>
                        <div class="attr-bar"><div id="bar-power" class="attr-fill power-fill" style="width:0%"></div></div>
                        <span id="val-power" class="attr-val">0</span>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">Endurance</span>
                        <div class="attr-bar"><div id="bar-endurance" class="attr-fill endurance-fill" style="width:0%"></div></div>
                        <span id="val-endurance" class="attr-val">0</span>
                    </div>
                </div>
            </section>

            <!-- ── General stats ── -->
            <section class="stats-card">
                <div class="stat">
                    <span class="stat-label">Streak</span>
                    <span id="streakCount" class="stat-value goldy">0 days</span>
                </div>
                <div class="divider"></div>
                <div class="stat">
                    <span class="stat-label">Total XP</span>
                    <span id="totalXPDisplay" class="stat-value">0 xp</span>
                </div>
                <div class="divider"></div>
                <div class="stat">
                    <span class="stat-label">Completed</span>
                    <span id="totalCompleted" class="stat-value">0</span>
                </div>
            </section>

        </main>

        <!-- ── Footer nav ── -->
        <footer>
            <nav>
                <a href="trial.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M15 5l4-4 2 2-4 4"/>
                    </svg>
                    <span class="nav-label">Trials</span>
                </a>
                <a href="index.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>
                <a href="rankings.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 18h18M3 18l1-9 5 4 3-7 3 7 5-4 1 9"/>
                    </svg>
                    <span class="nav-label">Ranks</span>
                </a>
                <a href="profile.html" class="nav-active">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z"/>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>
        </footer>

        <script src="js/shared.js"></script>
        <script src="js/profil.js"></script>
    </body>
</html>
