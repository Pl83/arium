<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'none'; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="dark light">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/omens.css">
        <link rel="stylesheet" href="css/chronicle.css">
        <!-- Applies the stored theme before first paint; must stay in <head> -->
        <script src="js/theme.js"></script>
        <title>IRONVOW — Chronicle</title>
    </head>
    <body>
        <main class="app">
            <section class="chronicle-card">
                <p id="streakLine"></p>
                <p id="monthLine"></p>
                <div class="month-head">
                    <button id="prevMonth" class="month-nav" aria-label="Previous month" disabled>◀</button>
                    <h2 id="monthLabel"></h2>
                    <button id="nextMonth" class="month-nav" aria-label="Next month" disabled>▶</button>
                </div>
                <div id="weekdayRow" class="weekday-row"></div>
                <div id="monthGrid" class="month-grid"></div>
                <div id="dayDetail" class="day-detail" hidden>
                    <h3 id="detailDate"></h3>
                    <p id="detailBody"></p>
                </div>
            </section>

            <!-- ── Omens ── -->
            <section class="chronicle-card">
                <div class="omen-head">
                    <h2>Omens</h2>
                </div>
                <!-- populated by chronicle.js via renderOmenLog() -->
                <div id="omenLog"></div>
            </section>
        </main>

        <!-- ── Footer nav ── -->
        <footer>
            <nav>
                <a href="index.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>
                <a href="trial.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M15 5l4-4 2 2-4 4"/>
                    </svg>
                    <span class="nav-label">Ordeals</span>
                </a>
                <a href="chronicle.html" class="nav-active">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 5h16v15H4V5zM4 9h16M8 3v4M16 3v4M8 13h2M12 13h2M16 13h2M8 17h2"/>
                    </svg>
                    <span class="nav-label">Chronicle</span>
                </a>
                <a href="rankings.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 18h18M3 18l1-9 5 4 3-7 3 7 5-4 1 9"/>
                    </svg>
                    <span class="nav-label">Ranks</span>
                </a>
                <a href="profile.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z M9 12l2 2 4-4"/>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>
        </footer>

        <script src="cordova.js"></script>
        <script src="js/omens.js"></script>
        <script src="js/shared.js"></script>
        <script src="js/daylog.js"></script>
        <script src="js/chronicle.js"></script>
    </body>
</html>
