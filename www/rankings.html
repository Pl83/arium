<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'none'; img-src 'self' data: content:; connect-src https://*.supabase.co;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="dark light">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/splash.css">
        <link rel="stylesheet" href="css/rankings.css">
        <!-- Applies the stored theme before first paint; must stay in <head> -->
        <script src="js/theme.js"></script>
        <title>IRONVOW — Rankings</title>
    </head>
    <body>
        <main>
            <header class="rankings-heading">
                <span class="rankings-kicker">Global Standings</span>
                <h1 class="rankings-title">Rankings</h1>
            </header>
            <div class="app">
                <!-- The waiting sigil is inlined so it paints on the first frame
                     rather than after DOMContentLoaded. rankings.js re-renders an
                     identical one when it starts the fetch, then replaces it with
                     the standings. Keep in step with sigilLoaderMarkup() in
                     src/splash.ts. -->
                <div class="sigil-loader" role="status" aria-live="polite">
                    <svg class="sigil-loader-svg" viewBox="0 0 400 400" fill="none" stroke="currentColor" aria-hidden="true">
                        <g class="ring rim">
                            <circle cx="200" cy="200" r="190" stroke-width="4" opacity=".35"/>
                            <circle cx="200" cy="200" r="172" stroke-width="14" stroke-dasharray="6 46" opacity=".55"/>
                        </g>
                        <g class="ring wheel">
                            <circle cx="200" cy="200" r="150" stroke-width="4" opacity=".45"/>
                            <g stroke-width="5" opacity=".5">
                                <line x1="200" y1="50" x2="200" y2="86" transform="rotate(15 200 200)"/>
                                <line x1="200" y1="50" x2="200" y2="86" transform="rotate(75 200 200)"/>
                                <line x1="200" y1="50" x2="200" y2="86" transform="rotate(135 200 200)"/>
                                <line x1="200" y1="50" x2="200" y2="86" transform="rotate(195 200 200)"/>
                                <line x1="200" y1="50" x2="200" y2="86" transform="rotate(255 200 200)"/>
                                <line x1="200" y1="50" x2="200" y2="86" transform="rotate(315 200 200)"/>
                            </g>
                        </g>
                        <g class="ring star">
                            <path d="M200,100 250,286.6 113.4,150 300,200 113.4,250 250,113.4 200,300 150,113.4 286.6,250 100,200 286.6,150 150,286.6 Z"
                                  stroke-width="3.5" opacity=".5" stroke-linejoin="round"/>
                        </g>
                        <g class="cosmo">
                            <circle cx="200" cy="200" r="52" fill="currentColor" opacity=".1" stroke="none"/>
                            <path d="M200 168 L207 193 L232 200 L207 207 L200 232 L193 207 L168 200 L193 193 Z" fill="currentColor" stroke="none" opacity=".9"/>
                        </g>
                    </svg>
                    <p class="sigil-loader-label">Consulting the standings…</p>
                </div>
            </div>
        </main>

        <!-- ── Footer nav ── -->
        <footer>
            <nav>
                <a href="index.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>
                <a href="trial.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M15 5l4-4 2 2-4 4"/>
                    </svg>
                    <span class="nav-label">Ordeals</span>
                </a>
                <a href="chronicle.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 5h16v15H4V5zM4 9h16M8 3v4M16 3v4M8 13h2M12 13h2M16 13h2M8 17h2"/>
                    </svg>
                    <span class="nav-label">Chronicle</span>
                </a>
                <a href="rankings.html" class="nav-active">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 18h18M3 18l1-9 5 4 3-7 3 7 5-4 1 9"/>
                    </svg>
                    <span class="nav-label">Ranks</span>
                </a>
                <a href="profile.html">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z M9 12l2 2 4-4"/>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>
        </footer>

        <script src="js/houses.js"></script>
        <script src="js/splash.js"></script>
        <script src="js/shared.js"></script>
        <script src="js/namefilter.js"></script>
        <script src="js/blocklist.js"></script>
        <script src="js/supabase.config.js"></script>
        <script src="js/supabase.js"></script>
        <script src="js/rankings.js"></script>
    </body>
</html>
